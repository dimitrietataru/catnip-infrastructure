name: build-CI

on:
  push:
    branches:
    - ace
    - main
    - develop
    - feature/**
    - bugfix/**
    tags-ignore:
      - '**'
    paths-ignore:
      - 'README.md'

jobs:
  build:

    env:
      CONFIG: 'Release'
      SOLUTION: 'src/CatNip.Infrastructure.sln'

    runs-on: ubuntu-latest

    steps:
    - name: Configure GIT
      run: git config --global core.autocrlf true

    - name: Checkout
      uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 11.0.x
        cache: true
        cache-dependency-path: |
          **/*.csproj
          **/Directory.Build.props

    - name: dotnet restore
      run: dotnet restore $SOLUTION

    - name: dotnet format
      continue-on-error: true
      run: dotnet format $SOLUTION --verify-no-changes --severity info --no-restore

    - name: dotnet build
      run: dotnet build $SOLUTION --configuration $CONFIG --no-restore -warnaserror
